<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>LoveSathi — verified logon se baat</title>
<style>
  :root{
    --bg:#eef1f6; --card:#fff; --ink:#101828; --muted:#667085; --line:#e4e7ec;
    --pri:#0f766e; --pri2:#0d9488; --pri-soft:#e6f5f2; --danger:#c0392b; --ok:#12805c; --warn:#b54708;
    --r:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
  .hidden{display:none !important}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));background:linear-gradient(135deg,#0f766e,#12a594);color:#fff}
  .topbar .logo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
  .topbar .who{flex:1;min-width:0}
  .topbar .shop{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .sub{font-size:12px;opacity:.85}
  .icon-btn{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:15px}
  main{flex:1;padding:14px 14px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  .card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .card + .card{margin-top:12px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}.tiny{font-size:11.5px}.b{font-weight:700}.center{text-align:center}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 8px;font-weight:700}
  .divider{height:1px;background:var(--line);margin:12px 0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;background:var(--pri);color:#fff;font-weight:650;font-size:15px}
  .btn.block{width:100%}
  .btn.ghost{background:var(--pri-soft);color:var(--pri)}
  .btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.danger{background:#fdecea;color:var(--danger)}
  .btn.ok{background:#e3f6ee;color:var(--ok)}
  .btn.sm{padding:9px 13px;font-size:13.5px;border-radius:10px}
  .btn:disabled{opacity:.45}
  .field{margin-top:12px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .inp{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
  .inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;background:#e4e9ee;border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;padding:10px;border-radius:9px;font-weight:650;font-size:14px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .av{width:40px;height:40px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
  .item .t{font-weight:650}
  .pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri)}
  .pill.warn{background:#fff5dd;color:var(--warn)}
  .pill.bad{background:#fdecea;color:var(--danger)}
  .pill.ok{background:#e3f6ee;color:var(--ok)}
  .empty{text-align:center;padding:26px 10px;color:var(--muted)}
  .empty .big{font-size:30px;margin-bottom:8px}
  .auth{max-width:460px;margin:0 auto;width:100%}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .brand .mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#0f766e,#12a594);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;box-shadow:var(--shadow)}
  .brand h1{font-size:21px;margin:0;letter-spacing:-.02em}
  nav.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:10.5px;font-weight:650;border-radius:10px}
  nav.tabs button .ic{font-size:19px;line-height:1}
  nav.tabs button.on{color:var(--pri);background:var(--pri-soft)}
  .chat-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
  .msgs{flex:1;overflow:auto;padding:6px 2px 10px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 210px)}
  .bubble{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14.5px;word-wrap:break-word;white-space:pre-wrap}
  .bubble.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
  .bubble.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .bubble .tm{display:block;font-size:10px;opacity:.65;margin-top:3px}
  .composer{display:flex;gap:8px;align-items:flex-end;padding-top:8px}
  .composer .inp{flex:1;resize:none;max-height:90px}
  .rec{display:flex;align-items:center;gap:10px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;color:#9a3412}
  .dot{width:9px;height:9px;border-radius:50%;background:#ef4444;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:80;background:#101828;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88vw;text-align:center}
  .modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(9,15,28,.45);display:flex;align-items:flex-end;justify-content:center}
  .modal{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .modal h3{margin:0 0 4px;font-size:17px}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
  .x{width:32px;height:32px;border-radius:10px;background:#f1f4f9;display:grid;place-items:center;font-size:16px;color:var(--muted);flex:0 0 auto}
  audio{width:100%;margin-top:8px}
  .callui{position:fixed;inset:0;z-index:90;background:#0b1220;display:none;align-items:center;justify-content:center;padding:16px}
  .callcard{width:100%;max-width:460px;text-align:center;color:#fff}
  .callname{font-size:20px;font-weight:800;margin-bottom:4px}
  .callstatus{font-size:13px;opacity:.75;margin-bottom:12px}
  .remoteVid{width:100%;max-height:52vh;background:#111827;border-radius:16px;object-fit:cover}
  .localVid{position:absolute;right:22px;bottom:120px;width:96px;height:128px;border-radius:12px;background:#1f2937;object-fit:cover;border:2px solid rgba(255,255,255,.25)}
  .callbtns{display:flex;gap:14px;justify-content:center;margin-top:18px}
  .cbtn{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:22px;display:grid;place-items:center}
  .cbtn.danger{background:#dc2626}
  .cbtn.on{background:#16a34a}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal-wrap hidden"></div>
<script>
"use strict";

/* =========================================================
   LoveSathi — client
   Signup: User ID + naam + male/female + voice sample
   Account tabhi khulta hai jab admin voice sun kar approve kare.
   ========================================================= */

var LS_URL = 'chat_server_url';
var LS_TOKEN = 'chat_token';
var LS_USER = 'chat_user';

var SRV = localStorage.getItem(LS_URL) || '';
var TOKEN = localStorage.getItem(LS_TOKEN) || '';
var ME = null;
try { ME = JSON.parse(localStorage.getItem(LS_USER) || 'null'); } catch (e) { ME = null; }

var authTab = 'login';
var tab = 'chats';
var chats = [];
var users = [];
var pending = [];
var openWith = null;      // {id,name,username}
var msgs = [];
var lastMsgAt = '';
var busy = false;
var pollTimer = null;
var pendingStatus = '';   // pending screen ke liye

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); }
function initials(s){ s = String(s || '?').trim(); return s ? s.slice(0,1).toUpperCase() : '?'; }
function toast(msg){
  var old = document.querySelector('.toast'); if (old) old.remove();
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ if (t.parentNode) t.remove(); }, 2600);
}
function hm(iso){
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}
function dm(iso){
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var today = new Date();
  if (d.toDateString() === today.toDateString()) return hm(iso);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
}
function cfgUrl(){ return String(SRV || '').replace(/\/+$/, ''); }
function api(path, opts){
  if (!cfgUrl()) return Promise.reject(new Error('server URL set nahi hai'));
  var o = opts || {};
  var h = { 'Content-Type': 'application/json' };
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  o.headers = h;
  return fetch(cfgUrl() + path, o).then(function(r){
    return r.text().then(function(t){
      var j = {}, isJson = true;
      try { j = JSON.parse(t || '{}'); } catch (e) { isJson = false; }
      if (!r.ok) {
        if (!isJson) {
          var hint = 'Is URL par chat server nahi mila (' + r.status + '). Ye app file ka link lagta hai — pehle server deploy karein, phir uska URL daalein.';
          var e1 = new Error(hint); e1.status = r.status; e1.code = 'badserver';
          throw e1;
        }
        var msg = j.message || j.error || ('Server error ' + r.status);
        var err = new Error(msg);
        err.code = j.error; err.status = r.status;
        throw err;
      }
      if (!isJson) {
        var e2 = new Error('Server ka jawab samajh nahi aaya — URL check karein');
        e2.code = 'badserver';
        throw e2;
      }
      return j;
    });
  });
}
function saveAuth(token, user){
  TOKEN = token || '';
  ME = user || null;
  try {
    if (TOKEN) localStorage.setItem(LS_TOKEN, TOKEN); else localStorage.removeItem(LS_TOKEN);
    if (ME) localStorage.setItem(LS_USER, JSON.stringify(ME)); else localStorage.removeItem(LS_USER);
  } catch (e) {}
}
function openExternal(url){
  if (window.AndroidBridge && window.AndroidBridge.openUrl) { try { window.AndroidBridge.openUrl(url); return; } catch (e) {} }
  window.open(url, '_blank');
}

/* =========================================================
   BOOT
   ========================================================= */
function boot(){
  if (!cfgUrl()) return renderServerSetup();
  if (!TOKEN || !ME) return renderAuth();
  api('/api/me').then(function(j){
    ME = j.user; saveAuth(TOKEN, ME);
    if (ME.role === 'admin' && ME.status === 'approved') tab = 'chats';
    renderMain();
  }, function(e){
    if (e.status === 401) { saveAuth('', null); renderAuth(); }
    else { renderAuth(); toast('Server se connect nahi hua — URL check karein'); }
  });
}

/* ---------- server setup ---------- */
function renderServerSetup(){
  document.getElementById('app').innerHTML =
    '<main>' +
      '<div class="auth">' +
        '<div class="brand"><div class="mark">L</div><div><h1>LoveSathi</h1>' +
          '<div class="small muted">Verified logon se baat</div></div></div>' +
        '<div class="card">' +
          '<div class="b">Server address</div>' +
          '<div class="small muted">Jahan chat server chal raha hai (ya host kiya hai) uska URL.</div>' +
          '<div class="field"><label>Server URL</label><input class="inp" id="srvUrl" placeholder="https://mera-chat-server.com" value="' + esc(SRV) + '"></div>' +
          '<div class="row mt12" style="gap:8px">' +
            '<button class="btn ghost grow" data-act="testServer">Connection test</button>' +
            '<button class="btn grow" data-act="saveServer">Aage badhein</button>' +
          '</div>' +
          '<div id="srvMsg" class="small mt8"></div>' +
          '<button class="btn line block mt12" data-act="serverHelp">❓ Server kaise banayein? (guide)</button>' +
          '<div class="tiny muted mt12">Example: laptop par test ke liye http://192.168.1.5:8090</div>' +
        '</div>' +
      '</div>' +
    '</main>';
}

function showServerHelp(){
  showModal(
    '<div class="sheet-head"><div><h3>Server kaise banayein</h3>' +
      '<div class="small muted">App ko chalane ke liye ek chhota server chahiye</div></div>' +
      '<button class="x" data-act="closeModal">✕</button></div>' +

    '<div class="card" style="box-shadow:none;background:#f8fafc">' +
      '<div class="b small">Aasan tareeka — Render (free, mobile se bhi ho jata hai)</div>' +
      '<div class="small mt8">1. LoveSathi-Server.zip khol kar 3 files nikalein: server.js, package.json, Dockerfile.</div>' +
      '<div class="small mt8">2. github.com par account banayein → New repository → naam lovesathi-server → "uploading an existing file" → teen files upload karein → Commit.</div>' +
      '<div class="small mt8">3. render.com par GitHub se sign up karein → New + → Web Service → apna repo chunein → Language: Docker → Instance: Free → Create.</div>' +
      '<div class="small mt8">4. 2-3 minute baad URL milega, jaise https://lovesathi-server.onrender.com</div>' +
      '<div class="small mt8">5. Wahi URL yahan Server URL mein daalein aur "Connection test" dabayein — ✅ aana chahiye.</div>' +
    '</div>' +

    '<div class="card" style="box-shadow:none;background:#fff7ed">' +
      '<div class="b small">Jaldi test karna hai — laptop se</div>' +
      '<div class="small mt8">Laptop par folder khol kar <b>node server.js</b> chalayein. Laptop aur phone same WiFi par hon, phir URL: <b>http://&lt;laptop-ip&gt;:8090</b> (jaise http://192.168.1.5:8090).</div>' +
    '</div>' +

    '<div class="card" style="box-shadow:none;background:#fef2f2">' +
      '<div class="b small">Dhyan rakhein</div>' +
      '<div class="small mt8">• Server URL wo hota hai jahan <b>server chal raha ho</b> — app ki .html file ka link nahi.<br>' +
      '• Free server so jata hai: pehla request 30-50 second le sakta hai, timeout ho to dobara try karein.<br>' +
      '• Server chalne ke baad sabse pehla signup aapka admin account banega.</div>' +
    '</div>' +

    '<button class="btn block mt12" data-act="closeModal">Samajh gaya</button>'
  );
}

function testServer(){
  var v = (document.getElementById('srvUrl').value || '').trim().replace(/\/+$/, '');
  var box = document.getElementById('srvMsg');
  if (!/^https?:\/\//i.test(v)) { box.style.color = 'var(--danger)'; box.textContent = 'URL http:// ya https:// se shuru hona chahiye'; return; }
  if (/\.html?(\?|$)/i.test(v)) { box.style.color = 'var(--danger)'; box.textContent = 'Ye app file ka link hai — chat server ka URL daalein (README dekhein)'; return; }
  box.style.color = 'var(--muted)'; box.textContent = 'Check ho raha hai...';
  fetch(v + '/health').then(function(r){ return r.text().then(function(t){
    var j = {}; try { j = JSON.parse(t); } catch (e) {}
    if (r.ok && j && j.ok) {
      box.style.color = 'var(--ok)';
      box.textContent = '✅ Server mil gaya (' + (j.service || 'chat') + ') — ab "Aage badhein" dabayein';
    } else {
      box.style.color = 'var(--danger)';
      box.textContent = '❌ Is URL par chat server nahi mila (status ' + r.status + ')';
    }
  }); }, function(e){
    box.style.color = 'var(--danger)';
    box.textContent = '❌ Connect nahi hua: ' + e.message;
  });
}

/* ---------- auth ---------- */
function renderAuth(){
  var body = authTab === 'login' ? loginHTML() : signupHTML();
  document.getElementById('app').innerHTML =
    '<main>' +
      '<div class="auth">' +
        '<div class="brand"><div class="mark">L</div><div><h1>LoveSathi</h1>' +
          '<div class="small muted">Verified logon se baat</div></div></div>' +
        '<div class="seg">' +
          '<button class="' + (authTab === 'login' ? 'on' : '') + '" data-act="authTab" data-id="login">Login</button>' +
          '<button class="' + (authTab === 'signup' ? 'on' : '') + '" data-act="authTab" data-id="signup">Naya account</button>' +
        '</div>' +
        body +
        '<div class="tiny muted center mt16">Server: ' + esc(cfgUrl()) + ' <button class="small" style="text-decoration:underline" data-act="changeServer">badlein</button></div>' +
      '</div>' +
    '</main>';
  if (authTab === 'signup') updateVoiceUI();
}
function loginHTML(){
  return '<div class="card mt12">' +
    '<div class="b">Login</div>' +
    '<div class="small muted">Aapka account admin ne verify kiya hona chahiye.</div>' +
    '<div class="field"><label>User ID</label><input class="inp" id="lgUser" placeholder="jaise: aman_23" autocomplete="username"></div>' +
    '<div class="field"><label>Password</label><input class="inp" id="lgPass" type="password" autocomplete="current-password"></div>' +
    '<button class="btn block mt16" data-act="doLogin">Login</button>' +
    '<div id="authErr" class="small mt8" style="color:var(--danger)"></div>' +
  '</div>';
}
function signupHTML(){
  return '<div class="card mt12">' +
    '<div class="b">Naya account</div>' +
    '<div class="small muted">Account banega, par khulega tabhi jab admin aapki voice sun kar approve karega.</div>' +
    '<div class="field"><label>User ID (unique)</label><input class="inp" id="suUser" placeholder="a-z, 0-9, _ (3-20)" autocomplete="username"></div>' +
    '<div class="field"><label>Aapka naam</label><input class="inp" id="suName" placeholder="jaise: Aman Sharma"></div>' +
    '<div class="field"><label>Mobile number</label><input class="inp" id="suPhone" inputmode="tel" maxlength="10" placeholder="10 digit mobile"></div>' +
    '<div class="field"><label>Email</label><input class="inp" id="suEmail" inputmode="email" placeholder="aapka@email.com"></div>' +
    '<div class="field"><label>Gender</label>' +
      '<div class="seg">' +
        '<button class="' + (genderPick === 'male' ? 'on' : '') + '" data-act="gender" data-id="male">Male</button>' +
        '<button class="' + (genderPick === 'female' ? 'on' : '') + '" data-act="gender" data-id="female">Female</button>' +
      '</div></div>' +
    '<div class="field"><label>Password</label><input class="inp" id="suPass" type="password" autocomplete="new-password"></div>' +
    '<div class="divider"></div>' +
    '<div class="b small">🎙 Voice verification</div>' +
    '<div class="tiny muted">Record dabayein aur saaf awaaz mein bolein: "Mera naam ___ hai, main is app par account bana raha hoon." 5-10 second.</div>' +
    '<div id="voiceBox" class="mt8"></div>' +
    '<button class="btn block mt16" data-act="doSignup" id="signupBtn">Request bhejein</button>' +
    '<div id="authErr" class="small mt8" style="color:var(--danger)"></div>' +
  '</div>';
}

/* ---------- voice recording ---------- */
var genderPick = 'male';
var rec = null, recChunks = [], voiceBlob = null, voiceUrl = '', recStartAt = 0, recTimer = null, recStream = null;

function updateVoiceUI(){
  var box = document.getElementById('voiceBox');
  if (!box) return;
  if (rec) {
    var secs = Math.floor((Date.now() - recStartAt) / 1000);
    box.innerHTML = '<div class="rec"><span class="dot"></span><span>Recording... ' + secs + 's</span>' +
      '<span class="grow"></span><button class="btn danger sm" data-act="recStop">Rok dein</button></div>';
    return;
  }
  if (voiceBlob) {
    box.innerHTML = '<div class="rec" style="background:#f0fdf4;border-color:#bbf7d0;color:#166534">' +
      '<span>✅ Sample ready (' + (voiceBlob.size / 1024).toFixed(0) + ' KB)</span><span class="grow"></span>' +
      '<button class="btn line sm" data-act="recReset">Dobara</button></div>' +
      '<audio id="voicePlay" controls src="' + voiceUrl + '"></audio>';
    return;
  }
  box.innerHTML = '<button class="btn ghost block" data-act="recStart">🎙 Record karein</button>';
}
function recStart(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('Is device par mic support nahi hai');
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    recStream = stream;
    recChunks = [];
    var mime = '';
    if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
      else if (MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
    }
    try { rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
    catch (e) { rec = new MediaRecorder(stream); }
    rec.ondataavailable = function(e){ if (e.data && e.data.size) recChunks.push(e.data); };
    rec.onstop = function(){
      var blob = new Blob(recChunks, { type: (rec && rec.mimeType) || 'audio/webm' });
      if (voiceUrl) { try { URL.revokeObjectURL(voiceUrl); } catch (e) {} }
      voiceBlob = blob;
      voiceUrl = URL.createObjectURL(blob);
      stopTracks();
      rec = null;
      updateVoiceUI();
    };
    rec.start();
    recStartAt = Date.now();
    updateVoiceUI();
    recTimer = setInterval(updateVoiceUI, 500);
    setTimeout(function(){ if (rec) recStop(); }, 15000); // max 15 sec
  }, function(err){
    toast('Mic permission nahi mila: ' + (err && err.name ? err.name : 'error'));
  });
}
function recStop(){
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (e) { rec = null; } }
  else { rec = null; updateVoiceUI(); }
}
function recReset(){
  voiceBlob = null;
  if (voiceUrl) { try { URL.revokeObjectURL(voiceUrl); } catch (e) {} }
  voiceUrl = '';
  updateVoiceUI();
}
function stopTracks(){
  if (recStream) { try { recStream.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {} recStream = null; }
}
function blobToB64(blob){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){ resolve(String(fr.result)); };
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

/* =========================================================
   CALLS — WebRTC (voice + video), signaling server se
   ========================================================= */
var ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
var call = null, callCursor = '', callPollTimer = null;

function callSupported(){ return !!(window.RTCPeerConnection && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
function newCallId(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function postCall(peerId, id, kind, data, type){
  return api('/api/call', { method: 'POST', body: JSON.stringify({ to: peerId, callId: id, kind: kind, data: data, type: type || 'audio' }) })
    .catch(function(){});
}
function getMedia(type){
  var constraints = { audio: true, video: type === 'video' ? { facingMode: 'user' } : false };
  return navigator.mediaDevices.getUserMedia(constraints);
}
function newPC(){
  var pc = new RTCPeerConnection(ICE);
  pc.onicecandidate = function(e){
    if (e.candidate && call) {
      var c = (e.candidate.toJSON ? e.candidate.toJSON() : e.candidate);
      postCall(call.peerId, call.id, 'ice', c, call.type);
    }
  };
  pc.ontrack = function(e){
    if (!call) return;
    call.remoteStream = e.streams && e.streams[0] ? e.streams[0] : null;
    var v = document.getElementById('remoteVideo');
    var a = document.getElementById('remoteAudio');
    if (call.type === 'video' && v && call.remoteStream) { v.srcObject = call.remoteStream; try { v.play(); } catch (er) {} }
    if (a && call.remoteStream) { a.srcObject = call.remoteStream; try { a.play(); } catch (er) {} }
    setCallStatus('Connected');
  };
  pc.onconnectionstatechange = function(){
    if (!call) return;
    var st = pc.connectionState;
    if (st === 'connected') setCallStatus('Connected');
    else if (st === 'failed') setCallStatus('Network problem — call band kar rahe hain');
    else if (st === 'disconnected') setCallStatus('Connection weak...');
  };
  return pc;
}
function attachLocal(stream){
  var lv = document.getElementById('localVideo');
  if (lv && call && call.type === 'video') { lv.srcObject = stream; try { lv.play(); } catch (e) {} }
}
function setCallStatus(t){
  var el = document.getElementById('callStatus');
  if (el) el.textContent = t;
}
function openCallUI(status){
  var el = document.getElementById('callUI');
  if (!el) { el = document.createElement('div'); el.id = 'callUI'; document.body.appendChild(el); }
  el.className = 'callui';
  el.innerHTML =
    '<div class="callcard">' +
      '<div class="callname">' + esc(call ? call.peerName : '') + '</div>' +
      '<div class="callstatus" id="callStatus">' + esc(status || '') + '</div>' +
      '<video id="remoteVideo" autoplay playsinline class="remoteVid"' + (call && call.type === 'video' ? '' : ' style="display:none"') + '></video>' +
      '<video id="localVideo" autoplay playsinline muted class="localVid"' + (call && call.type === 'video' ? '' : ' style="display:none"') + '></video>' +
      '<audio id="remoteAudio" autoplay></audio>' +
      '<div class="callbtns" id="callBtns">' +
        '<button class="cbtn" data-act="callMute">🎙</button>' +
        '<button class="cbtn danger" data-act="callEnd">✕</button>' +
        '<button class="cbtn" data-act="callCam">🎥</button>' +
      '</div>' +
    '</div>';
  el.style.display = 'flex';
}
function closeCallUI(){
  var el = document.getElementById('callUI');
  if (el) { el.style.display = 'none'; el.innerHTML = ''; }
}
function renderIncoming(){
  var btns = document.getElementById('callBtns');
  if (!btns) return;
  btns.innerHTML =
    '<button class="cbtn danger" data-act="callReject">✕</button>' +
    '<button class="cbtn on" data-act="callAccept">📞</button>';
}
function startCall(type){
  if (!openWith) return;
  if (!callSupported()) return toast('Is device par call support nahi hai');
  if (call) return toast('Pehle chalu call band karein');
  var id = newCallId();
  call = { id: id, peerId: openWith.id, peerName: openWith.name, type: type, role: 'caller', pc: null, local: null, pendingIce: [] };
  openCallUI('Connecting...');
  getMedia(type).then(function(stream){
    call.local = stream;
    attachLocal(stream);
    var pc = newPC(); call.pc = pc;
    stream.getTracks().forEach(function(t){ pc.addTrack(t, stream); });
    return pc.createOffer().then(function(off){ return pc.setLocalDescription(off).then(function(){ return off; }); });
  }).then(function(off){
    return postCall(call.peerId, call.id, 'offer', { sdp: off.sdp, type: off.type }, call.type);
  }).then(function(){
    setCallStatus('Ringing...');
    startCallPolling();
  }).catch(function(e){
    endCall('Call nahi lag payi: ' + (e && e.message ? e.message : 'mic/camera problem'));
  });
}
function acceptCall(){
  if (!call || !call.pendingOffer) return;
  var offer = call.pendingOffer;
  call.pendingOffer = null;
  openCallUI('Connecting...');
  getMedia(call.type).then(function(stream){
    call.local = stream;
    attachLocal(stream);
    var pc = newPC(); call.pc = pc;
    stream.getTracks().forEach(function(t){ pc.addTrack(t, stream); });
    return pc.setRemoteDescription(new RTCSessionDescription(offer))
      .then(function(){ return pc.createAnswer(); })
      .then(function(ans){ return pc.setLocalDescription(ans).then(function(){ return ans; }); });
  }).then(function(ans){
    return postCall(call.peerId, call.id, 'answer', { sdp: ans.sdp, type: ans.type }, call.type);
  }).then(function(){
    setCallStatus('Connected');
    startCallPolling();
    flushIce();
  }).catch(function(e){
    endCall('Call nahi jud payi: ' + (e && e.message ? e.message : 'mic/camera problem'));
  });
}
function flushIce(){
  if (!call || !call.pc) return;
  (call.pendingIce || []).forEach(function(c){ try { call.pc.addIceCandidate(c); } catch (e) {} });
  call.pendingIce = [];
}
function rejectCall(){
  if (!call) return;
  postCall(call.peerId, call.id, 'reject', null, call.type);
  endCall('Call reject kar di');
}
function endCall(msg){
  if (call && call.pc) {
    try { postCall(call.peerId, call.id, 'end', null, call.type); } catch (e) {}
    try { call.pc.close(); } catch (e) {}
  }
  if (call && call.local) { try { call.local.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {} }
  call = null;
  closeCallUI();
  if (callPollTimer) { clearInterval(callPollTimer); callPollTimer = null; }
  if (msg) toast(msg);
}
function toggleMute(){
  if (!call || !call.local) return;
  var on = call.local.getAudioTracks().map(function(t){ return t.enabled; })[0];
  call.local.getAudioTracks().forEach(function(t){ t.enabled = !on; });
  var b = document.querySelector('[data-act="callMute"]');
  if (b) b.classList.toggle('on', !!on);
  toast(on ? 'Mic band' : 'Mic chalu');
}
function toggleCam(){
  if (!call || !call.local) return;
  var tracks = call.local.getVideoTracks();
  if (!tracks.length) return toast('Ye voice call hai');
  var on = tracks[0].enabled;
  tracks.forEach(function(t){ t.enabled = !on; });
  var b = document.querySelector('[data-act="callCam"]');
  if (b) b.classList.toggle('on', !!on);
  toast(on ? 'Camera band' : 'Camera chalu');
}
function handleCallEvent(ev){
  if (!ev || !ev.kind) return;
  if (ev.kind === 'offer') {
    if (call) { postCall(ev.from, ev.callId, 'reject', null, ev.type); return; }
    call = { id: ev.callId, peerId: ev.from, peerName: ev.fromName || 'User', type: ev.type || 'audio', role: 'callee', pc: null, local: null, pendingOffer: ev.data, pendingIce: [] };
    openCallUI('Incoming ' + ((ev.type === 'video') ? 'video' : 'voice') + ' call...');
    renderIncoming();
    startCallPolling();
    return;
  }
  if (!call || ev.callId !== call.id) return;
  if (ev.kind === 'answer' && call.pc) {
    call.pc.setRemoteDescription(new RTCSessionDescription(ev.data)).then(function(){ setCallStatus('Connected'); flushIce(); }).catch(function(){});
  } else if (ev.kind === 'ice') {
    if (call.pc && call.pc.remoteDescription) { try { call.pc.addIceCandidate(ev.data); } catch (e) {} }
    else call.pendingIce.push(ev.data);
  } else if (ev.kind === 'end') {
    endCall('Call khatam ho gayi');
  } else if (ev.kind === 'reject') {
    endCall('Call reject ho gayi');
  }
}
function pollCallInbox(){
  if (!TOKEN || !ME) return;
  api('/api/call/inbox' + (callCursor ? '?since=' + encodeURIComponent(callCursor) : '')).then(function(j){
    var evs = j.events || [];
    if (evs.length) callCursor = evs[evs.length - 1].at;
    evs.forEach(handleCallEvent);
  }, function(){});
}
function startCallPolling(){
  if (callPollTimer) return;
  pollCallInbox();
  callPollTimer = setInterval(pollCallInbox, 1200);
}

/* =========================================================
   ACTIONS
   ========================================================= */
function openChat(id){
  var u = users.find(function(x){ return x.id === id; });
  if (!u) {
    var c = chats.find(function(x){ return x.userId === id; });
    u = c ? { id: c.userId, name: c.name, username: c.username } : null;
  }
  if (!u) return toast('User nahi mila');
  openWith = { id: u.id, name: u.name, username: u.username };
  msgs = []; lastMsgAt = '';
  tab = 'chat';
  renderView();
  loadMessages('').then(function(){ paintMessages(); });
  syncNav();
}
function paintMessages(){
  var box = document.getElementById('msgs');
  if (!box) return;
  box.innerHTML = msgs.length ? msgs.map(function(m){
    var mine = m.from === ME.id;
    return '<div class="bubble ' + (mine ? 'me' : 'them') + '">' + esc(m.text) + '<span class="tm">' + hm(m.at) + '</span></div>';
  }).join('') : '<div class="empty small">Koi message nahi — pehla message bhejein.</div>';
  box.scrollTop = box.scrollHeight;
}
function sendMsg(){
  var box = document.getElementById('msgBox');
  if (!box) return;
  var text = (box.value || '').trim();
  if (!text) return;
  if (!openWith) return;
  box.value = '';
  api('/api/messages', { method: 'POST', body: JSON.stringify({ to: openWith.id, text: text }) }).then(function(j){
    msgs.push(j.message);
    lastMsgAt = j.message.at;
    paintMessages();
  }, function(e){ toast('Message nahi gaya: ' + e.message); });
}
function loadVoice(id){
  var host = document.getElementById('voice_' + id);
  if (!host) return;
  host.innerHTML = '<span class="tiny muted">load ho raha hai...</span>';
  fetch(cfgUrl() + '/api/voice/' + encodeURIComponent(id), { headers: { 'Authorization': 'Bearer ' + TOKEN } })
    .then(function(r){ if (!r.ok) throw new Error('voice nahi mila'); return r.blob(); })
    .then(function(b){
      var url = URL.createObjectURL(b);
      host.innerHTML = '<audio controls autoplay src="' + url + '"></audio>';
    })
    .catch(function(e){ host.innerHTML = '<span class="tiny" style="color:var(--danger)">' + esc(e.message) + '</span>'; });
}
function decide(id, approve){
  api('/api/admin/decision', { method: 'POST', body: JSON.stringify({ id: id, approve: approve }) }).then(function(j){
    toast(approve ? 'Approve ho gaya: ' + j.user.name : 'Reject kar diya');
    pending = pending.filter(function(x){ return x.id !== id; });
    loadUsers();
    renderView();
  }, function(e){ toast('Nahi hua: ' + e.message); });
}
function logout(){
  saveAuth('', null);
  openWith = null; msgs = []; chats = []; users = []; pending = [];
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  renderAuth();
}
function syncNav(){
  var btns = document.querySelectorAll('nav.tabs button');
  for (var i = 0; i < btns.length; i++){
    if (btns[i].getAttribute('data-id') === tab) btns[i].classList.add('on');
    else btns[i].classList.remove('on');
  }
}
function goTab(id){
  tab = id;
  renderView();
  syncNav();
  if (id === 'admin') loadPending().then(function(){ renderView(); });
  if (id === 'users') loadUsers().then(function(){ renderView(); });
  if (id === 'chats') loadChats().then(function(){ renderView(); });
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id') || '';
  switch (act) {
    case 'saveServer': saveServer(); break;
    case 'testServer': testServer(); break;
    case 'serverHelp': showServerHelp(); break;
    case 'changeServer': changeServer(); break;
    case 'authTab': authTab = id; renderAuth(); break;
    case 'gender':
      genderPick = id;
      var gb = document.querySelectorAll('[data-act="gender"]');
      for (var gi = 0; gi < gb.length; gi++) {
        if (gb[gi].getAttribute('data-id') === id) gb[gi].classList.add('on');
        else gb[gi].classList.remove('on');
      }
      break;
    case 'doLogin': doLogin(); break;
    case 'doSignup': doSignup(); break;
    case 'recStart': recStart(); break;
    case 'recStop': recStop(); break;
    case 'recReset': recReset(); break;
    case 'checkStatus': renderAuth(); break;
    case 'backLogin': authTab = 'login'; renderAuth(); break;
    case 'nav': goTab(id); break;
    case 'openChat': openChat(id); break;
    case 'backChats': tab = 'chats'; openWith = null; renderView(); syncNav(); loadChats().then(function(){ if (tab === 'chats') renderView(); }); break;
    case 'sendMsg': sendMsg(); break;
    case 'callStart': startCall(id); break;
    case 'callAccept': acceptCall(); break;
    case 'callReject': rejectCall(); break;
    case 'callEnd': endCall('Call band'); break;
    case 'callMute': toggleMute(); break;
    case 'callCam': toggleCam(); break;
    case 'loadVoice': loadVoice(id); break;
    case 'approve': decide(id, true); break;
    case 'reject': decide(id, false); break;
    case 'logout': logout(); break;
    case 'closeModal': closeModal(); break;
    default: break;
  }
});
document.addEventListener('keydown', function(e){
  if (e.target && e.target.id === 'msgBox' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  if (e.target && e.target.id === 'lgPass' && e.key === 'Enter') doLogin();
});
function showModal(html){
  var m = document.getElementById('modal');
  m.innerHTML = '<div class="modal">' + html + '</div>';
  m.classList.remove('hidden');
}
function closeModal(){
  var m = document.getElementById('modal');
  m.classList.add('hidden'); m.innerHTML = '';
}

window.__back = function(){
  var m = document.getElementById('modal');
  if (m && !m.classList.contains('hidden')) { closeModal(); return true; }
  if (tab === 'chat') { tab = 'chats'; openWith = null; renderView(); syncNav(); return true; }
  if (tab !== 'chats') { tab = 'chats'; renderView(); syncNav(); return true; }
  return false;
};

boot();
</script>
